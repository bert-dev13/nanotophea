services:
  - type: web
    name: nanotophea-admet
    runtime: python
    rootDir: services/admet-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ADMET_API_KEY
        sync: false
